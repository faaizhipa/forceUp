<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  
  <!-- Clock face -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="white" stroke-width="4"/>
  
  <!-- Clock center -->
  <circle cx="64" cy="64" r="4" fill="white"/>
  
  <!-- Hour hand -->
  <line x1="64" y1="64" x2="64" y2="35" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Minute hand -->
  <line x1="64" y1="64" x2="85" y2="75" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Globe lines (latitude/longitude) -->
  <ellipse cx="64" cy="64" rx="45" ry="20" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="64" y1="19" x2="64" y2="109" stroke="white" stroke-width="2" opacity="0.4"/>
  
  <!-- Hour markers -->
  <circle cx="64" cy="23" r="3" fill="white"/>
  <circle cx="105" cy="64" r="3" fill="white"/>
  <circle cx="64" cy="105" r="3" fill="white"/>
  <circle cx="23" cy="64" r="3" fill="white"/>
</svg>
