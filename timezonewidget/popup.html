<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Sync Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 400px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #2d2d44;
    }

    .popup-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .settings-btn {
      padding: 6px 10px;
      font-size: 11px;
      border: 1px solid #4a4a6a;
      background: transparent;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .settings-btn:hover {
      background: #4a4a6a;
    }

    #widget-container {
      padding: 16px;
    }

    .settings-panel {
      padding: 16px;
      display: none;
    }

    .settings-panel.active {
      display: block;
    }

    .settings-group {
      margin-bottom: 16px;
    }

    .settings-group label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .settings-group select,
    .settings-group input {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      background: #2d2d44;
      border: 1px solid #4a4a6a;
      border-radius: 6px;
      color: #fff;
    }

    .settings-group select:focus,
    .settings-group input:focus {
      outline: none;
      border-color: #6366f1;
    }

    .favorites-list {
      margin-top: 8px;
    }

    .favorite-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #2d2d44;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .favorite-item button {
      padding: 4px 8px;
      font-size: 10px;
      border: none;
      background: #ef4444;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
    }

    .add-favorite-btn {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      border: 1px dashed #4a4a6a;
      background: transparent;
      color: #888;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 8px;
    }

    .add-favorite-btn:hover {
      border-color: #6366f1;
      color: #6366f1;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-primary {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      border: none;
      background: #6366f1;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-primary:hover {
      background: #5558dd;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #4a4a6a;
      background: transparent;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn-secondary:hover {
      background: #2d2d44;
    }

    .search-container {
      position: relative;
      margin-bottom: 8px;
    }

    .search-container input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      background: #2d2d44;
      border: 1px solid #4a4a6a;
      border-radius: 6px;
      color: #fff;
    }

    .timezone-dropdown {
      max-height: 200px;
      overflow-y: auto;
      background: #2d2d44;
      border: 1px solid #4a4a6a;
      border-radius: 6px;
      display: none;
    }

    .timezone-dropdown.active {
      display: block;
    }

    .timezone-option {
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .timezone-option:hover {
      background: #4a4a6a;
    }

    .explorer-section {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #2d2d44;
      border-radius: 10px;
      background: #161629;
    }

    .explorer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .explorer-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .explorer-subtitle {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .explorer-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .explorer-actions button {
      padding: 6px 10px;
      font-size: 11px;
      border: 1px solid #4a4a6a;
      background: #232343;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .explorer-actions button:hover {
      border-color: #6366f1;
      color: #e0e7ff;
    }

    .tz-band-map {
      display: grid;
      grid-template-columns: repeat(27, 1fr);
      gap: 2px;
      margin: 10px 0 12px;
      background: #0f1020;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2d2d44;
    }

    .tz-band {
      height: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #9ca3af;
      background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
      border-radius: 4px;
      border: 1px solid #1f2937;
      cursor: pointer;
    }

    .tz-band.active {
      border-color: #818cf8;
      color: #e0e7ff;
      box-shadow: 0 0 0 1px #4f46e5;
    }

    .explorer-search {
      position: relative;
      margin-bottom: 8px;
    }

    .explorer-search input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      background: #2d2d44;
      border: 1px solid #4a4a6a;
      border-radius: 6px;
      color: #fff;
    }

    .explorer-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      background: #121225;
    }

    .explorer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #1f1f35;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .explorer-item:last-child {
      border-bottom: none;
    }

    .explorer-item:hover {
      background: #1f1f35;
    }

    .explorer-item.active {
      background: #232345;
      border-left: 2px solid #6366f1;
    }

    .explorer-item .label {
      font-size: 12px;
      color: #e5e7eb;
      font-weight: 600;
    }

    .explorer-item .meta {
      font-size: 11px;
      color: #9ca3af;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>Global Sync</h1>
    <button class="settings-btn" id="toggle-settings">Settings</button>
  </div>

  <div id="widget-container"></div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-group">
      <label>My Timezone</label>
      <select id="local-timezone"></select>
    </div>

    <div class="settings-group">
      <label>Customer Timezone</label>
      <select id="customer-timezone"></select>
    </div>

    <div class="settings-group">
      <label>Favorite Timezones</label>
      <div class="favorites-list" id="favorites-list"></div>
      <div class="search-container hidden" id="add-favorite-container">
        <input type="text" id="favorite-search" placeholder="Search timezone...">
        <div class="timezone-dropdown" id="timezone-dropdown"></div>
      </div>
      <button class="add-favorite-btn" id="add-favorite-btn">+ Add Favorite</button>
    </div>

    <div class="explorer-section">
      <div class="explorer-header">
        <div>
          <div class="explorer-title">Timezone Explorer</div>
          <div class="explorer-subtitle">Pick a zone, then assign it or add to favorites.</div>
        </div>
        <div class="explorer-actions">
          <button id="set-local-btn" title="Set as My Timezone">Set My TZ</button>
          <button id="set-customer-btn" title="Set as Customer Timezone">Set Customer</button>
          <button id="add-fav-btn" title="Add to favorites">+ Favorite</button>
        </div>
      </div>
      <div class="tz-band-map" id="tz-band-map"></div>
      <div class="explorer-search">
        <input type="text" id="explorer-search" placeholder="Search city, region, or offset (e.g. UTC+8)">
      </div>
      <div class="explorer-list" id="explorer-list"></div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="cancel-btn">Cancel</button>
      <button class="btn-primary" id="save-btn">Save</button>
    </div>
  </div>

  <script src="modules/timezoneUtils.js"></script>
  <script src="modules/globalSyncWidget.js"></script>
  <script src="popup.js"></script>
</body>
</html>
